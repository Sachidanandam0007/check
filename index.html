<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b2c7ab">
<title>jegadharani. — business, marketing &amp; finance</title>
<meta name="description" content="Portfolio of Jegadharani Amarnath: MBA student at PSG Institute of Management with a pull towards business strategy, finance, marketing and AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#b2c7ab;--bg2:#c4d4be;--ink:#15201a;--mute:#3f5143;--line:rgba(21,32,26,.25);--acc:#fff;--d:"Space Grotesk",system-ui,sans-serif;--s:"Instrument Serif",Georgia,serif;box-sizing:border-box}
[data-theme=dark]{--bg:#111712;--bg2:#1a231c;--ink:#dce8d6;--mute:#8da08b;--line:rgba(220,232,214,.2);--acc:#b2c7ab}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--d);overflow-x:hidden;transition:background .5s,color .5s;-webkit-font-smoothing:antialiased}
main{overflow-x:clip}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
h1,h2,h3{font-weight:500;letter-spacing:-.045em;line-height:.92;text-transform:lowercase}
.lab{font:italic 400 clamp(20px,2.2vw,30px)/1 var(--s);display:block;margin-bottom:6px;color:var(--mute)}
.dot{color:var(--acc)}
.wrap{padding:0 4%}
/* loader */
.ld{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;padding:30px 4%;transition:transform 1s cubic-bezier(.76,0,.24,1)}
.ld b{font:500 clamp(90px,22vw,320px)/.8 var(--d);letter-spacing:-.06em}.ld span{font:italic 400 28px var(--s)}
.ld.done{transform:translateY(-100%)}
/* header + clocks */
.hd{position:fixed;inset:0 0 auto;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:16px 4%;background:linear-gradient(var(--bg) 60%,transparent)}
.logo{font:500 28px/1 var(--d);letter-spacing:-.06em}
.nv{display:flex;gap:26px;align-items:center;font-size:15px}
.nv a{position:relative}.nv a:after{content:"";position:absolute;left:0;bottom:-3px;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .4s}.nv a:hover:after,.nv a.on:after{transform:scaleX(1);transform-origin:left}
.th{border:1px solid var(--ink);background:none;border-radius:99px;padding:4px 14px;font-size:13px;cursor:pointer;transition:.3s}.th:hover{background:var(--ink);color:var(--bg)}
.ham{display:none;background:none;border:0;cursor:pointer;font-size:15px}
.ck{position:fixed;left:0;right:0;top:64px;z-index:90;overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);background:var(--bg);font-size:12px;letter-spacing:.04em}
.mq{display:inline-flex;animation:mq 50s linear infinite;padding:7px 0}.mq span{padding:0 22px}.mq b{font-weight:500;margin-left:8px;font-variant-numeric:tabular-nums}
@keyframes mq{to{transform:translateX(-50%)}}
/* hero */
.hero{min-height:100vh;padding:150px 4% 50px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:20px 4%;position:relative}
.rl{list-style:none;grid-column:1;align-self:start;font-size:clamp(15px,1.5vw,20px);line-height:1.5}.rl li:before{content:"— ";color:var(--mute)}
.ph{grid-column:2;grid-row:1/3;justify-self:end;width:min(100%,520px);aspect-ratio:4/5;border-radius:28px;overflow:hidden;position:relative;box-shadow:0 30px 80px -30px rgba(21,32,26,.5);transform:perspective(1000px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .3s}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transform:scale(1.04)}
.hn{grid-column:1/3;grid-row:2;font:500 clamp(48px,15.5vw,270px)/.8 var(--d);letter-spacing:-.07em;text-transform:lowercase;position:relative;z-index:2;white-space:nowrap;align-self:end;margin-bottom:-.04em}
.hn span{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em}.hn b{display:inline-block;font-weight:inherit;transform:translateY(110%);transition:transform 1.3s cubic-bezier(.16,1,.3,1)}.go .hn b{transform:none}
.sc{position:absolute;left:4%;bottom:6px;font-size:12px;color:var(--mute)}
/* sections */
.sec{padding:130px 4%}
.big{font-size:clamp(54px,11vw,190px)}
.pr{max-width:640px;font-size:clamp(17px,1.7vw,22px);line-height:1.45;margin:34px 0}
.lm{display:inline-flex;gap:10px;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:2px;font-size:15px;transition:gap .3s}.lm:hover{gap:20px}
/* works slider */
.wh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:46px;gap:20px;flex-wrap:wrap}
.ar{display:flex;gap:10px}.ar button{width:54px;height:54px;border-radius:50%;border:1px solid var(--ink);background:none;cursor:pointer;font-size:20px;transition:.3s}.ar button:hover{background:var(--ink);color:var(--bg)}
.rail{scroll-padding-left:4%;display:flex;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -4%;padding:0 4%;cursor:grab}.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:min(560px,82vw);scroll-snap-align:start;display:block}
.art{aspect-ratio:4/3;border-radius:22px;background:var(--bg2);overflow:hidden;position:relative;transition:transform .7s cubic-bezier(.16,1,.3,1),border-radius .5s}
.card:hover .art{transform:scale(.97);border-radius:34px}
.art svg{width:100%;height:100%;display:block}.art .n{position:absolute;left:18px;top:14px;font:italic 400 22px var(--s)}
.card h3{font-size:clamp(26px,3vw,40px);margin:20px 0 8px;line-height:1}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tg span{border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:12px;color:var(--mute)}
.ty{font-size:14px;color:var(--mute)}
.va{display:block;overflow:hidden;white-space:nowrap;margin:70px -4% 0;border-block:1px solid var(--line);padding:18px 0}.va div{display:inline-flex;animation:mq 30s linear infinite}.va span{font:500 clamp(40px,7vw,100px)/1 var(--d);letter-spacing:-.05em;padding:0 30px;text-transform:lowercase}.va:hover div{animation-play-state:paused}
/* services */
.svc{border-top:1px solid var(--line);display:grid;grid-template-columns:90px 1fr 1fr;gap:20px 30px;padding:40px 0;align-items:start;transition:padding .5s,background .4s;position:relative}
.svc:hover{padding-left:20px}
.svc .no{font:italic 400 28px var(--s)}.svc h3{font-size:clamp(34px,5vw,76px)}
.svc ul{list-style:none;font-size:16px;color:var(--mute)}.svc li{padding:3px 0}
.svc .art{position:absolute;right:4%;top:50%;width:min(320px,26vw);transform:translateY(-50%) scale(.6) rotate(-5deg);opacity:0;pointer-events:none;transition:.6s cubic-bezier(.16,1,.3,1);z-index:5;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.svc:hover .art{opacity:1;transform:translateY(-50%) scale(1) rotate(3deg)}
.chat{text-align:center;padding:140px 4%}.chat .big{margin:6px 0 24px}.chat p{max-width:420px;margin:0 auto 34px;color:var(--mute)}
.btn{display:inline-block;border:1px solid var(--ink);border-radius:99px;padding:16px 36px;font-size:16px;cursor:pointer;background:none;transition:.3s}.btn:hover,.btn.f{background:var(--ink);color:var(--bg)}.btn.f:hover{opacity:.85}
/* footer */
.ft{padding:60px 4% 34px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;border-top:1px solid var(--line)}
.ft h4{font:italic 400 22px var(--s);color:var(--mute);margin-bottom:10px;font-weight:400}.ft li{list-style:none}.ft a:hover{text-decoration:underline}
.fb{grid-column:1/4;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-top:30px}.fb b{font:500 clamp(70px,16vw,260px)/.8 var(--d);letter-spacing:-.07em}.fb span{font-size:13px;color:var(--mute)}
/* inner pages */
.pg{padding:170px 4% 100px;min-height:100vh}
.ab{display:grid;grid-template-columns:1fr 1.3fr;gap:6%;margin-top:60px;align-items:start}
.ab .ph{grid-column:auto;grid-row:auto;justify-self:start;position:sticky;top:150px}
.ab p{font-size:clamp(17px,1.6vw,21px);line-height:1.5;margin-bottom:22px;max-width:640px}
.tl{margin-top:70px}.tr{display:grid;grid-template-columns:200px 1fr;gap:30px;padding:26px 0;border-top:1px solid var(--line)}.tr time{font:italic 400 24px var(--s)}.tr h3{font-size:clamp(22px,2.6vw,36px);line-height:1.05;margin-bottom:6px}.tr p{color:var(--mute);font-size:15px;max-width:620px}
.wl{margin-top:50px}.wr{display:grid;grid-template-columns:60px 1.4fr 1.4fr 100px;gap:20px;padding:26px 0;border-top:1px solid var(--line);align-items:center;transition:padding .4s,background .3s}.wr:hover{padding-left:16px;background:var(--bg2)}
.wr i{font:italic 400 24px var(--s)}.wr h3{font-size:clamp(24px,3vw,44px);line-height:1}.wr small{color:var(--mute)}
.dm{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid var(--line);padding:24px 0;margin:36px 0}.dm small{display:block;font:italic 400 20px var(--s);color:var(--mute)}
.dp{max-width:760px}.dp p{font-size:clamp(18px,1.8vw,24px);line-height:1.5;margin-bottom:22px}
.kl{list-style:none;margin:34px 0;border-top:1px solid var(--line)}.kl li{padding:16px 0;border-bottom:1px solid var(--line);font-size:17px}.kl b{font-weight:500}
.pn{display:flex;justify-content:space-between;gap:20px;margin-top:80px;border-top:1px solid var(--line);padding-top:30px}.pn small{display:block;font:italic 400 20px var(--s);color:var(--mute)}.pn b{font:500 clamp(24px,3.4vw,50px)/1 var(--d);letter-spacing:-.04em;text-transform:lowercase}.pn a:hover b{text-decoration:underline}
.fm{max-width:640px;margin-top:40px}.fg{margin-bottom:22px}.fg label{display:block;font:italic 400 20px var(--s);color:var(--mute)}.fg input,.fg textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--ink);padding:10px 0;font:inherit;font-size:18px;color:var(--ink);outline:none}.fg textarea{min-height:110px;resize:vertical}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:12px 24px;border-radius:99px;font-size:14px;z-index:400;opacity:0;transition:.4s}.toast.show{transform:translate(-50%,0);opacity:1}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.16,1,.3,1)}.rv.in{opacity:1;transform:none}
.wipe{position:fixed;inset:0;background:var(--ink);z-index:250;transform:translateY(100%);pointer-events:none}
@media(max-width:860px){.hero{grid-template-columns:1fr;grid-template-rows:auto auto auto;padding-top:140px}.ph{grid-column:1;grid-row:2;justify-self:center;width:min(86%,400px)}.hn{grid-column:1;grid-row:3;margin-top:20px}.rl{grid-row:1}.ab,.tr,.svc,.wr,.ft,.dm{grid-template-columns:1fr}.ab .ph{position:relative;top:0}.fb{grid-column:1}.svc .art{display:none}.nv{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column;justify-content:center;font-size:34px;gap:26px;z-index:99}.nv.open{display:flex}.ham{display:block;position:relative;z-index:101}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rv,.hn b{opacity:1;transform:none}}
</style>
</head>
